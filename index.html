<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figma Builder Audit — Grid to Element Reference</title>

<style>
:root{
--c-bg:#F7F6F2;
--c-surface:#FFFFFF;
--c-surface2:#F1EFE8;
--c-border:#D3D1C7;
--c-border2:#E8E6DF;
--c-accent:#534AB7;
--c-accent-l:#EEEDFE;
--c-accent-m:#7F77DD;
--c-head:#2C2C2A;
--c-body:#444441;
--c-muted:#5F5E5A;
--c-hint:#888780;

--f-display: Georgia, serif;
--f-body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
--f-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{
font-family:var(--f-body);
background:var(--c-bg);
color:var(--c-body);
font-size:14px;
line-height:1.6;
}

/* SIDEBAR */
.sidebar{
position:fixed;top:0;left:0;width:220px;height:100vh;
background:var(--c-head);overflow:auto;
}

.logo{
font-family:var(--f-display);
color:#fff;font-size:18px;padding:20px;
}

.nav-item{
display:block;padding:10px 20px;
color:#aaa;text-decoration:none;
font-size:13px;border-left:2px solid transparent;
}
.nav-item:hover{color:#fff;background:#ffffff10;}
.nav-item.active{color:#fff;border-left-color:var(--c-accent-m);}

/* MAIN */
.main{margin-left:220px;}
.topbar{
padding:16px 32px;background:#fff;border-bottom:1px solid var(--c-border);
display:flex;justify-content:space-between;
font-family:var(--f-mono);font-size:11px;
}

/* CONTENT */
.content{padding:40px;max-width:960px;}

/* SECTION */
.section{margin-bottom:64px;}
.section-title{
font-family:var(--f-display);
font-size:22px;color:var(--c-head);
margin-bottom:10px;
}

/* STEP */
.step{
margin-bottom:20px;border:1px solid var(--c-border2);
border-radius:10px;background:#fff;
}
.step-head{
padding:12px 16px;background:var(--c-surface2);
cursor:pointer;font-weight:600;
}
.step-body{display:none;padding:16px;}
.step.open .step-body{display:block;}

/* GRID */
.kv{
display:grid;
grid-template-columns:1fr 1fr;
gap:1px;background:var(--c-border);
font-family:var(--f-mono);font-size:11px;
}
.kv div{padding:6px 10px;}
.kv-k{background:var(--c-surface2);}
.kv-v{background:#fff;font-weight:500;}

/* PAGE SWITCH */
.page{display:none;}
.page.active{display:block;}

@media print{
.sidebar,.topbar{display:none;}
.main{margin:0;}
.step-body{display:block !important;}
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
<div class="logo">Figma<br>Audit</div>

<a class="nav-item active" data-page="p1">01 Grid</a>
<a class="nav-item" data-page="p2">02 Frame</a>
<a class="nav-item" data-page="p3">03 Navbar</a>
<a class="nav-item" data-page="p4">04 Hero</a>
<a class="nav-item" data-page="p5">05 Content</a>
<a class="nav-item" data-page="p6">06 Layouts</a>
<a class="nav-item" data-page="p7">07 Text</a>
<a class="nav-item" data-page="p8">08 Buttons</a>
<a class="nav-item" data-page="p9">09 Cards</a>
<a class="nav-item" data-page="p10">10 Forms</a>
<a class="nav-item" data-page="p11">11 Footer</a>
<a class="nav-item" data-page="p12">12 Spacing</a>
</aside>

<!-- MAIN -->
<div class="main">
<div class="topbar">
<span>Figma Builder Audit</span>
<span id="breadcrumb">Step 01 · Grid</span>
</div>

<div class="content">

<div class="page active" id="p1">
<div class="section">
<div class="section-title">Grid</div>

<div class="step open">
<div class="step-head">1.1 Create root frame</div>
<div class="step-body">
<div class="kv">
<div class="kv-k">Width</div><div class="kv-v">1440px</div>
<div class="kv-k">Height</div><div class="kv-v">Auto</div>
</div>
</div>
</div>

<div class="step">
<div class="step-head">1.2 12-column grid</div>
<div class="step-body">
<div class="kv">
<div class="kv-k">Columns</div><div class="kv-v">12</div>
<div class="kv-k">Margin</div><div class="kv-v">120px</div>
</div>
</div>
</div>

</div>
</div>

<!-- replicate structure for other pages if needed -->

</div>
</div>

<script>
const pages=document.querySelectorAll('.page');
const nav=document.querySelectorAll('.nav-item');

nav.forEach(n=>{
n.onclick=()=>{
nav.forEach(i=>i.classList.remove('active'));
n.classList.add('active');

pages.forEach(p=>p.classList.remove('active'));
document.getElementById(n.dataset.page).classList.add('active');

document.getElementById('breadcrumb').textContent=n.textContent;
};
});

document.querySelectorAll('.step-head').forEach(h=>{
h.onclick=()=>h.parentElement.classList.toggle('open');
});
</script>

</body>
</html>
